on:
  repository_dispatch:
    types:
      - resource-published
jobs:
  update-algolia-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies for action
        run: |
          cd .github/actions/helix-sync-algolia
          npm install
#
#      - name: Setup tmate session
#        uses: mxschmitt/action-tmate@v3

      - name: Helix Sync With Algolia Index
        uses: ./.github/actions/helix-sync-algolia
